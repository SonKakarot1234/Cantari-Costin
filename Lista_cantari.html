    <style>
	body, html
	{
	    min-height: 100%;
            margin: 0;
	    padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	    color: white;
            display: flex;
	    flex-direction: column;
	    align-items: center;
	    justify-content: flex-start;
	    text-align: center;
	    padding: 50px, 0;
	    -ms-overflow-style: none;
	    scrollbar-width: none;
	}
	body::-webkit-scrollbar
	{
	    display: none;
	}
	.bg-image 
	{
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("https://t4.ftcdn.net/jpg/02/87/29/51/360_F_287295152_TWOf8EotxI1j8frrB1B4JsUTCZ4rwEkF.jpg");
            height: 100%;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            position: fixed;
	    width: 100%;
	    top: 0;
	    left: 0;
	    right: 0;
	    bottom: 0;
	    z-index: -1;
	    transform: translateZ(0);
	    -webkit-transform: translateZ(0);
        }
	body
	{
	    background-color: #1a1a1a;
	    overflow-x: hidden;
	}
	@keyframes fade_in
	{
	    from
	    {
		opacity: 0;
		transform: translateY(40px);
	    }
	    to
  	    {
		opacity: 1;
		transform: translateY(0);
	    }
	}
	h2 
	{
	    font-size: clamp(24px, 5vw, 40px);
	    margin-bottom: 30px;
	    text-shadow: 2px 2px 4px #000;
	}
	p
	{
	    font-size: 18px;
	    max-width: 600px;
	    line-height: 1.6;
	}
	.button, #player-container
	{
	    width: 320px;
	    max-width: 90vw;
	    box-sizing: border-box;
	}
	.button
	{
	    margin-top: 100px;
	    font-weight: bold;
	    text-decoration: none;
	    background-color: #000;
	    border-radius: 8px;
	    color: white;
	    padding: 30px 0;
	    text-align: center;
	    display: inline-block;
	    font-size: 16px;
	    cursor: pointer;
	    border: none;
	    transition: 0.3;
	    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
	    opacity: 0;
	    animation: fade_in 1s ease-out forwards;
	    margin-bottom: 10px;
	    flex-shrink: 0;
	}
	.button:hover
	{
	    box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
	    background-color: #3B3B3B;
	    transform: scale(1.05);
	    transform: translate(-3px);
	}
	#player-container
	{
	    display: none;
	    background: rgba(0,0,0,0.8);
	    padding: 20px;
	    border-radius: 8px;
	    width: 320px;
	    backdrop-filter: blur(10px);
	    border: 1px solid rgba(255,255,255,0.2);
	    animation: fade_in 0.5s ease-out forwards;
	}
	.player-controls
	{
	    display: flex;
	    align-items: center;
	    justify-content: space-between;
	    gap: 10px;
	}
	#play-pause-btn
	{
	    background: none;
	    border: 2px solid white;
	    border-radius: 50%;
	    color: white;
	    font-size: 24px;
	    width: 40px;
	    height: 40px;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    cursor: pointer;
	    transition: 0.2s;
	}
	.progress-container
	{
	    flex-grow: 1;
	    height: 5px;
	    background: #555;
	    border-radius: 5px;
	    position: relative;
	    cursor: pointer;
	}
	#play-pause-btn:hover
	{
	    background: white;
	    color: black;
	}
	#progress-bar
	{
	    width: 0%;
	    height: 100%;
	    background: white;
	    border-radius: 3px;
	}
	#time-remaining
	{
	    font-size: 12px;
	    min-width: 45px;
	    font-family: monospace;
	    text-align: right;
	}
	
	#back-to-top,
	#back-to-bottom
	{
	    position: fixed;
    	    right: 30px;
    	    width: 50px;
    	    height: 50px;
    	    background-color: #000;
    	    color: white;
    	    border: none;
    	    border-radius: 50%;
    	    font-size: 24px;
    	    font-weight: bold;
    	    cursor: pointer;
    	    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    	    display: none;
    	    z-index: 1000;
    	    transition: transform 0.2s, background-color 0.2s;
	    animation: fade_in 0.5s ease-out forwards;
	}
	#back-to-top
	{
    	    bottom: 90px;
	}
	#back-to-bottom
	{
    	    bottom: 30px;
	}
	#back-to-top:hover,
	#back-to-bottom:hover
	{
	    background-color: #3B3B3B;
    	    transform: scale(1.1);
	}
	#bg-picker-btn
	{
	    position: fixed;
	    left: 30px;
	    bottom: 30px;
	    width: 50px;
	    height: 50px;
	    background-color: #000;
	    color: white;
	    border: none;
	    border-radius: 50%;
	    font-size: 22px;
	    cursor: pointer;
	    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
	    z-index: 1000;
	    transition: transform 0.2s, background-color 0.2s;
	    animation: fade_in 0.5s ease-out forwards;
	}
	#bg-picker-btn:hover
	{
	    background-color: #3B3B3B;
    	    transform: scale(1.1);
	}
	#top-controls
	{
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    gap: 15px;
	    margin-top: 50px;
	    margin-bottom: 20px;
	    width: 100%;
	    max-width: 90vw;
	    z-index: 10;
	    position: relative;
	}
	#shuffle-btn 
	{
    	    padding: 15px 30px;
    	    font-size: 18px;
    	    font-weight: bold;
    	    color: white;
    	    background-color: #000; 
    	    border: none;
    	    border-radius: 50px;
    	    cursor: pointer;
    	    transition: 0.3s;
    	    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    	    flex-shrink: 0;
	}
	#shuffle-btn:hover 
	{
    	    background-color: #3B3B3B;
    	    transform: scale(1.05);
	}
	#search-wrapper
	{
	    position: relative;
	    flex: 1;
	    max-width: 320px;
	}
	#search-input
	{
	    width: 100%;
	    padding: 15px 20px;
	    font-size: 16px;
	    border: none;
	    border-radius: 50px;
	    background-color: rgba(0, 0, 0, 0.8);
	    color: white;
	    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
	    box-sizing: border-box;
	    outline: none;
	}
	#search-input::placeholder
	{
	    color: rgba(255,255,255,0.6);
	}
	#search-input:focus
	{
	    box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.3);
	}
	#search-results
	{
	    display: none;
	    position: absolute;
	    top: calc(100% + 8px);
	    left: 0;
	    right: 0;
	    max-height: 300px;
	    overflow-y: auto;
	    background: rgba(0, 0, 0, 0.95);
	    border-radius: 8px;
	    border: 1px solid rgba(255,255,255,0.2);
	    backdrop-filter: blur(10px);
	    z-index: 100;
	    text-align: left;
	    -ms-overflow-style: none;
	    scrollbar-width: none;
	}
	#search-results::-webkit-scrollbar
	{
	    display: none;
	}
	#search-results.visible
	{
	    display: block;
	}
	.search-result-item
	{
	    padding: 12px 16px;
	    cursor: pointer;
	    border-bottom: 1px solid rgba(255,255,255,0.1);
	    transition: background 0.2s;
	}
	.search-result-item:last-child
	{
	    border-bottom: none;
	}
	.search-result-item:hover
	{
	    background: rgba(255,255,255,0.1);
	}
	#mini-player
	{
	    display: none;
	    position: fixed;
	    bottom: 0;
	    left: 0;
	    right: 0;
	    background: rgba(0, 0, 0, 0.92);
	    backdrop-filter: blur(12px);
	    border-top: 1px solid rgba(255,255,255,0.2);
	    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
	    z-index: 1001;
	    box-sizing: border-box;
	}
	#mini-player.visible
	{
	    display: block;
	}
	.mini-player-title
	{
	    display: block;
	    font-size: 14px;
	    font-weight: bold;
	    white-space: nowrap;
	    overflow: hidden;
	    text-overflow: ellipsis;
	    margin-bottom: 10px;
	    text-align: left;
	}
	.mini-player-controls
	{
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    gap: 24px;
	    margin-bottom: 10px;
	}
	.mini-player-controls button
	{
	    background: none;
	    border: none;
	    color: white;
	    font-size: 22px;
	    cursor: pointer;
	    padding: 4px;
	    line-height: 1;
	}
	#mini-play-pause
	{
	    border: 2px solid white;
	    border-radius: 50%;
	    width: 44px;
	    height: 44px;
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    font-size: 18px;
	}
	#mini-loop.active
	{
	    color: #4CAF50;
	    transform: scale(1.15);
	}
	.mini-progress-container
	{
	    height: 4px;
	    background: #555;
	    border-radius: 4px;
	    cursor: pointer;
	}
	#mini-progress-bar
	{
	    width: 0%;
	    height: 100%;
	    background: white;
	    border-radius: 4px;
	}
	@media (min-width: 769px)
	{
	    #mini-player
	    {
	        display: none !important;
	    }
	}
	@media (max-width: 768px)
	{
	    body.mini-player-active
	    {
	        padding-bottom: calc(100px + env(safe-area-inset-bottom));
	    }
	    body.mini-player-active #back-to-top
	    {
	        bottom: calc(160px + env(safe-area-inset-bottom));
	    }
	    body.mini-player-active #back-to-bottom
	    {
	        bottom: calc(100px + env(safe-area-inset-bottom));
	    }
	    body.mini-player-active #bg-picker-btn
	    {
	        bottom: calc(100px + env(safe-area-inset-bottom));
	    }
	}
	@keyframes fadeInButton 
	{
    		from { opacity: 0; transform: translateY(20px); }
    		to { opacity: 1; transform: translateY(0); }
	}
    </style>
</head>

    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423102029-1723d06d-5f2d-4af1-aa46-9e42321d6ffd.mp3')">Trăim o vreme</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423117334-a8f905da-93d1-4030-9e46-4be43b1b7aa7.mp3')">Treziți-vă</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423146246-4d5881e5-38ca-4ad0-9a72-337f698354cb.mp3')">Tu dormi...</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423162036-721767b3-f656-4f4e-aa9c-ccc61378a56d.mp3')">Tu Ești scăparea mea</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423188292-84c9e56a-4a64-4bcc-8c0a-50ae4bacd3c9.mp3')">Tu gemi</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423240717-683fbe2e-dc3a-46f8-857b-0e4eac1b8f40.mp3')">Tu mă iubești</button>

    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423278412-10658f0a-afbf-4b89-9a28-5c8f3be7e8ee.mp3')">Tu-ai fi putut s-alegi</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423299616-368a78a6-da19-491c-8a77-a03f6e00d91c.mp3')">Veghează</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423313356-b0bf5c83-f1af-4381-9dbd-22c0b7fd2866.mp3')">Veghează-n zori</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423330582-f5f5fc65-e583-4f82-9437-f76d7a14001a.mp3')">Vorbește-mi Doamne</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423346067-50c737f7-00f9-4c35-bf12-a0de6dcdc3ac.mp3')">Vorbește-mi Tu Isuse</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423372167-44ecd999-4ea8-44b9-8305-f98ae914152f.mp3')">Vreau lângă Dumnezeu</button>
    <button class="button" onclick="playSong(this, 'https://image2url.com/r2/default/audio/1771423391574-e82d804c-25fd-47db-8265-3fe90f442efb.mp3')">Zi de zi</button>
    <div id="player-container">
        <div class="player-controls">
            <button id="play-pause-btn" onclick="toggleAudio()">▶</button>
	    <button id="loop-btn" onclick="toggleLoop()" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">🔁</button>
            <div class="progress-container" onclick="seek(event)">
                <div id="progress-bar"></div>
            </div>
            <span id="time-remaining">0:00</span>
        </div>
    </div>
    <div id="mini-player">
        <span id="mini-player-title" class="mini-player-title"></span>
        <div class="mini-player-controls">
            <button type="button" id="mini-prev" onclick="joacaPrecedenta()" aria-label="Cântarea anterioară">⏮</button>
            <button type="button" id="mini-play-pause" onclick="toggleAudio()" aria-label="Redare/Pauză">▶</button>
            <button type="button" id="mini-next" onclick="joacaUrmatoarea()" aria-label="Cântarea următoare">⏭</button>
            <button type="button" id="mini-loop" onclick="toggleLoop()" aria-label="Repetă">🔁</button>
        </div>
        <div class="mini-progress-container" onclick="seek(event)">
            <div id="mini-progress-bar"></div>
        </div>
    </div>
    <audio id="myAudio" playsinline preload="metadata"></audio>
    <script>
        const audio = document.getElementById('myAudio');
        const playerContainer = document.getElementById('player-container');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const timeRemaining = document.getElementById('time-remaining');
        const backToTopBtn = document.getElementById('back-to-top');
        const backToBottomBtn = document.getElementById('back-to-bottom');
	const loopBtn = document.getElementById('loop-btn');
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const miniPlayer = document.getElementById('mini-player');
        const miniPlayerTitle = document.getElementById('mini-player-title');
        const miniPlayPauseBtn = document.getElementById('mini-play-pause');
        const miniProgressBar = document.getElementById('mini-progress-bar');
        const miniLoopBtn = document.getElementById('mini-loop');
        const artworkUrl = 'https://t4.ftcdn.net/jpg/02/87/29/51/360_F_287295152_TWOf8EotxI1j8frrB1B4JsUTCZ4rwEkF.jpg';

        function isMobile()
        {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        const BG_DB_NAME = 'listaCantariSetari';
        const BG_STORE_NAME = 'fundal';
        const BG_KEY = 'fundalAles';
        let bgObjectUrl = null;

        function openBgDb()
        {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(BG_DB_NAME, 1);
                request.onupgradeneeded = () => {
                    request.result.createObjectStore(BG_STORE_NAME);
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function saveBgImage(blob)
        {
            const db = await openBgDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(BG_STORE_NAME, 'readwrite');
                tx.objectStore(BG_STORE_NAME).put(blob, BG_KEY);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function loadBgImage()
        {
            const db = await openBgDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(BG_STORE_NAME, 'readonly');
                const req = tx.objectStore(BG_STORE_NAME).get(BG_KEY);
                req.onsuccess = () => resolve(req.result || null);
                req.onerror = () => reject(req.error);
            });
        }

        function applyBgImage(blob)
        {
            const bgDiv = document.querySelector('.bg-image');
            if (bgObjectUrl)
                URL.revokeObjectURL(bgObjectUrl);
            bgObjectUrl = URL.createObjectURL(blob);
            bgDiv.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("${bgObjectUrl}")`;
        }

        async function initCustomBackground()
        {
            try
            {
                const blob = await loadBgImage();
                if (blob)
                    applyBgImage(blob);
            }
            catch (e)
            {
                console.log('Nu s-a putut încărca fundalul salvat', e);
            }
        }

        initCustomBackground();

        async function resetBgToDefault()
        {
            if (!confirm('Revii la fundalul implicit?'))
                return;
            try
            {
                const db = await openBgDb();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(BG_STORE_NAME, 'readwrite');
                    tx.objectStore(BG_STORE_NAME).delete(BG_KEY);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            catch (e)
            {
                console.log('Nu s-a putut șterge fundalul salvat', e);
            }
            if (bgObjectUrl)
            {
                URL.revokeObjectURL(bgObjectUrl);
                bgObjectUrl = null;
            }
            document.querySelector('.bg-image').style.backgroundImage = '';
        }

        const bgPickerBtn = document.getElementById('bg-picker-btn');
        let bgPressTimer = null;
        let bgLongPressTriggered = false;

        function startBgPressTimer()
        {
            bgPressTimer = setTimeout(() => {
                bgPressTimer = null;
                bgLongPressTriggered = true;
                resetBgToDefault();
            }, 600);
        }

        function cancelBgPressTimer()
        {
            if (bgPressTimer)
            {
                clearTimeout(bgPressTimer);
                bgPressTimer = null;
            }
        }

        bgPickerBtn.addEventListener('pointerdown', startBgPressTimer);
        bgPickerBtn.addEventListener('pointerup', cancelBgPressTimer);
        bgPickerBtn.addEventListener('pointerleave', cancelBgPressTimer);
        bgPickerBtn.addEventListener('pointercancel', cancelBgPressTimer);

        bgPickerBtn.addEventListener('click', () => {
            if (bgLongPressTriggered)
            {
                bgLongPressTriggered = false;
                return;
            }
            bgFileInput.click();
        });

        bgPickerBtn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            resetBgToDefault();
        });

        const bgFileInput = document.getElementById('bg-file-input');
        bgFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file)
                return;
            applyBgImage(file);
            try
            {
                await saveBgImage(file);
            }
            catch (err)
            {
                console.log('Nu s-a putut salva fundalul ales', err);
            }
            bgFileInput.value = '';
        });

        function setPlayPauseState(isPlaying)
        {
            const icon = isPlaying ? '⏸' : '▶';
            playPauseBtn.innerHTML = icon;
            miniPlayPauseBtn.innerHTML = icon;
        }

        function setLoopState(isActive)
        {
            if (isActive)
            {
                loopBtn.style.color = '#4CAF50';
                loopBtn.style.transform = 'scale(1.2)';
                loopBtn.title = 'Loop activat';
                miniLoopBtn.classList.add('active');
                miniLoopBtn.title = 'Loop activat';
            }
            else
            {
                loopBtn.style.color = 'initial';
                loopBtn.style.transform = 'scale(1)';
                loopBtn.title = 'Loop dezactivat';
                miniLoopBtn.classList.remove('active');
                miniLoopBtn.title = 'Loop dezactivat';
            }
        }

        function showMiniPlayer(title)
        {
            if (!isMobile())
                return;
            miniPlayerTitle.textContent = title;
            miniPlayer.classList.add('visible');
            document.body.classList.add('mini-player-active');
        }

        function hideMiniPlayer()
        {
            miniPlayer.classList.remove('visible');
            document.body.classList.remove('mini-player-active');
        }

        function getSongUrl(button)
        {
            const match = button.getAttribute('onclick').match(/playSong\(this,\s*'([^']+)'\)/);
            return match ? match[1] : null;
        }

        function startSong(butonulApasat, url)
        {
            audio.loop = false;
            setLoopState(false);
            butonulApasat.after(playerContainer);
            playerContainer.style.display = 'block';
            butonCurent = butonulApasat;

            if (audio.getAttribute('src') !== url)
            {
                audio.src = url;
                progressBar.style.width = '0%';
                miniProgressBar.style.width = '0%';
                timeRemaining.innerHTML = '0:00';
            }

            const titlu = butonulApasat.textContent.trim();
            updateMediaSession(titlu);
            showMiniPlayer(titlu);

            audio.play().then(() => {
                setPlayPauseState(true);
            }).catch((e) => {
                console.log('Așteaptă...', e);
                setPlayPauseState(false);
            });
        }

        function initMediaSession()
        {
            if (!('mediaSession' in navigator))
                return;
            navigator.mediaSession.setActionHandler('play', () => {
                audio.play().then(() => setPlayPauseState(true)).catch(e => console.log(e));
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
                setPlayPauseState(false);
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => joacaPrecedenta());
            navigator.mediaSession.setActionHandler('nexttrack', () => joacaUrmatoarea());
        }

        initMediaSession();

        function normalizeRomanian(text)
        {
            return text
                .toLowerCase()
                .replace(/ă|â/g, 'a')
                .replace(/î/g, 'i')
                .replace(/ș|ş/g, 's')
                .replace(/ț|ţ/g, 't');
        }

        function filterSongs(query)
        {
            const normalizedQuery = normalizeRomanian(query.trim());
            if (!normalizedQuery)
                return [];
            return Array.from(document.querySelectorAll('.button')).filter(btn =>
                normalizeRomanian(btn.textContent.trim()).startsWith(normalizedQuery)
            );
        }

        function renderSearchResults(matches)
        {
            searchResults.innerHTML = '';
            if (matches.length === 0)
            {
                searchResults.classList.remove('visible');
                return;
            }
            matches.forEach(btn =>
            {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                item.textContent = btn.textContent.trim();
                item.addEventListener('click', () => selectSongFromSearch(btn));
                searchResults.appendChild(item);
            });
            searchResults.classList.add('visible');
        }

        function selectSongFromSearch(button)
        {
            searchInput.value = '';
            searchResults.classList.remove('visible');
            searchResults.innerHTML = '';
            button.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => button.click(), 300);
        }

        searchInput.addEventListener('input', () =>
        {
            renderSearchResults(filterSongs(searchInput.value));
        });

        searchInput.addEventListener('focus', () =>
        {
            if (searchInput.value.trim())
                renderSearchResults(filterSongs(searchInput.value));
        });

        document.addEventListener('click', (e) =>
        {
            if (!e.target.closest('#search-wrapper'))
                searchResults.classList.remove('visible');
        });

	function toggleLoop()
	{
	    audio.loop = !audio.loop;
	    setLoopState(audio.loop);
	}

    let butonCurent = null; 

    function playSong(butonulApasat, url) 
	{
        const esteVizibil = playerContainer.style.display === "block";
        const esteSubAcestButon = playerContainer.previousElementSibling === butonulApasat;

        if (esteVizibil && esteSubAcestButon) 
		{
                playerContainer.style.display = "none";
                audio.pause();
                setPlayPauseState(false);
                butonCurent = null;
                hideMiniPlayer();
        } 
		else 
		{
            startSong(butonulApasat, url);
        }
    }
	
	function shuffleButtons() 
	{
    	    const container = document.body;
    	    const buttons = Array.from(document.querySelectorAll('.button'));
	    	audio.pause();
    	    for (let i = buttons.length - 1; i > 0; i--) 
	    	{
        		const j = Math.floor(Math.random() * (i + 1));
        		[buttons[i], buttons[j]] = [buttons[j], buttons[i]];
    	    }
    	    buttons.forEach(btn => {
        		container.insertBefore(btn, playerContainer);
    	    });
    	    window.scrollTo({ top: 0, behavior: 'smooth' });
	}
	
	function toggleAudio() 
	{
            if (!audio.paused) 
		{
            audio.pause();
            setPlayPauseState(false);
        	} 
	    else 
		{
            audio.play().then(() => {
                setPlayPauseState(true);
            }).catch(e => console.log(e));
        }
    }

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) 
	{
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + "%";
            miniProgressBar.style.width = percent + "%";
            let remaining = audio.duration - audio.currentTime;
            if (remaining < 0) 
				remaining = 0;
            const mins = Math.floor(remaining / 60);
            const secs = Math.floor(remaining % 60);
            timeRemaining.innerHTML = `-${mins}:${secs < 10 ? '0' : ''}${secs}`;
	    if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession)
	    {
		navigator.mediaSession.setPositionState({
                    duration: audio.duration,
                    playbackRate: audio.playbackRate,
                    position: audio.currentTime
                });
	    }
	}
    });

    audio.addEventListener('play', () => {
	if ('mediaSession' in navigator)
	    navigator.mediaSession.playbackState = "playing";
        setPlayPauseState(true);
    });
    audio.addEventListener('pause', () => {
        if ('mediaSession' in navigator) 
	    navigator.mediaSession.playbackState = "paused";
        setPlayPauseState(false);
    });
    function seek(event) 
	{
        if (!audio.duration) 
			return;
        const rect = event.currentTarget.getBoundingClientRect(); 
        const x = event.clientX - rect.left; 
        audio.currentTime = (x / rect.width) * audio.duration;
    }

    function joacaUrmatoarea()
    {
	if (!butonCurent)
	    return;
	const toateButoanele = Array.from(document.querySelectorAll('.button'));
        const indexCurent = toateButoanele.indexOf(butonCurent);
	if (indexCurent !== -1 && indexCurent < toateButoanele.length - 1) 
	{
            const urmatorulButon = toateButoanele[indexCurent + 1];
            const url = getSongUrl(urmatorulButon);
            if (document.hidden || !isMobile())
            {
                startSong(urmatorulButon, url);
            }
            else
            {
                urmatorulButon.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => startSong(urmatorulButon, url), 300);
            }
        }
	else 
	{
            setPlayPauseState(false);
            progressBar.style.width = "0%";
            miniProgressBar.style.width = "0%";
        }
    }

    function joacaPrecedenta()
    {
	if (!butonCurent) 
	    return;
        const toateButoanele = Array.from(document.querySelectorAll('.button'));
        const indexCurent = toateButoanele.indexOf(butonCurent);
        if (indexCurent !== -1 && indexCurent > 0) 
	{
            const butonulPrecedent = toateButoanele[indexCurent - 1];
            const url = getSongUrl(butonulPrecedent);
            if (document.hidden || !isMobile())
            {
                startSong(butonulPrecedent, url);
            }
            else
            {
                butonulPrecedent.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => startSong(butonulPrecedent, url), 300);
            }
        }
    }

    audio.onended = () => {
	if (audio.loop)
	    return;
	joacaUrmatoarea();
    };

    function updateMediaSession(titlu) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: titlu,
                artist: 'Lista de cântări',
                album: 'Playlist',
                artwork: [
                    { src: artworkUrl, sizes: '96x96', type: 'image/jpeg' },
                    { src: artworkUrl, sizes: '128x128', type: 'image/jpeg' },
                    { src: artworkUrl, sizes: '256x256', type: 'image/jpeg' },
                    { src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }
                ]
            });
        }
    }	
	
    function updateScrollButtons()
    {
        const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = document.documentElement.clientHeight;
        const nearBottom = scrollTop + clientHeight >= scrollHeight - 300;

        if (backToTopBtn)
            backToTopBtn.style.display = scrollTop > 300 ? "block" : "none";
        if (backToBottomBtn)
            backToBottomBtn.style.display = nearBottom ? "none" : "block";
    }

    window.onscroll = updateScrollButtons;
    updateScrollButtons();

    function scrollToTop() 
	{ 
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
    }

    function scrollToBottom()
    {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    }
    </script>
</body>
</html>
